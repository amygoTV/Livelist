name: Livelist Auto Update

on:
  schedule:
    # 每 6 小时自动更新一次（UTC 时间，01:17 / 07:17 / 13:17 / 19:17）
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: livelist-update
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch, validate and generate playlists
        run: python scripts/update_livelist.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add IPTV.m3u CCTV.m3u CNTV.m3u EPG.xml STATUS.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto update playlists $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
